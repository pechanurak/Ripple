<script>
  // Initialize EmailJS with the new Public Key
  emailjs.init("J3QgpxQ8ZMSjF_8Vf");

  const toast = document.getElementById('formToast');
  const toastTitle = toast.querySelector('.toast-title');
  const toastMessage = toast.querySelector('.toast-message');
  const toastIcon = toast.querySelector('.toast-icon');

  function showToast(type, title, message) {
    toast.classList.remove('show-success', 'show-error');
    toast.classList.add(type === 'success' ? 'show-success' : 'show-error');
    toastTitle.textContent = title;
    toastMessage.textContent = message;
    toastIcon.className = 'toast-icon ' + (type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-xmark');
    toast.classList.add('show');

    clearTimeout(showToast.timeoutId);
    showToast.timeoutId = setTimeout(() => {
      toast.classList.remove('show');
    }, 4000);
  }

  function isValidContact(value) {
    const trimmed = value.trim();
    if (!trimmed) return false;

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phonePattern = /^[0-9\-+()\s]{8,15}$/;
    return emailPattern.test(trimmed) || phonePattern.test(trimmed);
  }

  // Pre-fill message with the project name when arriving from a project detail page
  const projectName = new URLSearchParams(window.location.search).get('project');
  const messageField = document.querySelector('#contactForm textarea[name="title"]');
  const projectTag = document.getElementById('projectTag');
  const projectCheckbox = document.getElementById('projectCheckbox');

  if (projectName) {
    const prefix = `สนใจปรึกษาโครงการ: ${projectName}\n\n`;
    document.getElementById('projectNameLabel').textContent = projectName;
    projectTag.style.display = 'flex';
    messageField.value = prefix;
    messageField.focus();
    messageField.setSelectionRange(prefix.length, prefix.length);

    projectCheckbox.addEventListener('change', () => {
      if (projectCheckbox.checked) {
        if (!messageField.value.startsWith(prefix)) {
          messageField.value = prefix + messageField.value;
        }
      } else if (messageField.value.startsWith(prefix)) {
        messageField.value = messageField.value.slice(prefix.length);
      }
    });
  }

  // Handle form submission
  document.getElementById("contactForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const contactInput = this.elements.contact;
    if (!isValidContact(contactInput.value)) {
      showToast('error', 'ข้อมูลติดต่อไม่ถูกต้อง', 'กรุณากรอกเบอร์โทรศัพท์หรืออีเมลให้ถูกต้อง');
      contactInput.focus();
      return;
    }

    emailjs.sendForm("service_oydc0ys", "template_w71ngmh", this)
      .then(function() {
        showToast('success', 'ส่งข้อความสำเร็จ', 'ทีมงานจะติดต่อกลับไปในไม่ช้า');
        document.getElementById("contactForm").reset();
      }, function(error) {
        showToast('error', 'ส่งข้อความไม่สำเร็จ', 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง');
      });
  });
</script>
